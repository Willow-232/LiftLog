<!-- LiftLog: a personal Hevy-style workout tracker. MIT License. Single file, no dependencies. Host anywhere. -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171c;--sub:#6b7280;--ac:#e8590c;--ln:#e3e5ea;--ok:#2f9e44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--sub:#98a0ad;--ac:#ff8a3d;--ln:#2a2e38;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceef2;--sub:#98a0ad;--ac:#ff8a3d;--ln:#2a2e38;--ok:#51cf66}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h2{margin:6px 0 12px;font-size:24px}h3{margin:20px 0 8px;font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--ln)}button.big{width:100%;padding:14px;font-size:17px}
button.red{background:#e03131}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:8px;width:100%}
input.title{font-size:22px;font-weight:700;border:0;background:transparent;padding:4px 0}
.set{display:grid;grid-template-columns:28px 1fr 80px 70px 40px;gap:6px;align-items:center;margin-top:6px}
.set input{text-align:center;padding:7px 4px}input::placeholder{color:var(--sub);opacity:.55}.set .sub{text-align:center}
.chk{padding:8px 0;background:var(--ln);color:var(--sub)}.chk.on{background:var(--ok);color:#fff}
.hd{font-size:11px;color:var(--sub);text-transform:uppercase}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;display:none;z-index:6;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;max-width:560px;margin:0 auto}
.item{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.toast{background:var(--ok);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-weight:600}
.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--ln);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{text-align:center;margin:0}.stats b{font-size:22px;display:block}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><span id="rt"></span><span data-a="skip" style="cursor:pointer">Skip</span></div>
<nav>
<button data-t="w">🏋️<br>Workout</button><button data-t="h">🗒️<br>History</button><button data-t="s">📈<br>Stats</button><button data-t="e">💪<br>Exercises</button><button data-t="m">⚙️<br>More</button>
</nav>

const _P={ch:'M30 27Q22 26 17 29Q15 36 19 40Q26 42 30 40Z',up:'M30 25Q23 24 18 27L19 31Q25 28 30 29Z',fd:'M17 28Q12 28 11 34Q12 38 16 37Q18 33 17 28Z',sd:'M11 30Q8 32 9 38L11 40Q12 35 11 30Z',bi:'M12 38Q9 40 9 46L11 51Q14 48 15 43Q15 40 12 38Z',fa:'M9 52L7 63L10 64L13 53Z',ab:'M29 41h-5v5h5zM29 47.5h-5v5h5zM29 54h-5v6h5z',ob:'M23 41Q19 46 20 58L23 59Q22 50 24 41Z',hf:'M23 61L29 62L29 66L22 65Z',qu:'M21 66Q19 78 21 92L28 92Q30 78 29 66Z',ad:'M29 68L30 68L30 88L28 88Z',tr:'M30 20L22 23L18 28L24 32L30 38Z',rh:'M30 33L24 33L23 42L30 44Z',la:'M19 38Q21 46 23 57L30 61L30 45L24 43Q22 41 19 38Z',lb:'M30 52L24 55L25 62L30 62Z',gl:'M30 62L21 63Q19 70 24 74Q29 74 30 70Z',ha:'M21 75Q19 88 22 100L28 100Q30 88 30 75Z',ca:'M22 102Q20 108 22 114L28 114Q29 108 28 102Z'};

const HT={'Bench Press':`Lie on the bench, eyes under the bar, feet flat, shoulder blades pinched back.|Unrack and lower the bar to mid-chest with elbows about 45-75 degrees from your body.|Press up and slightly back until your arms are straight.`,'Incline Dumbbell Press':`Set the bench to 30-45 degrees and hold dumbbells at chest level.|Press up until arms are straight, bringing the weights together over your upper chest.|Lower slowly to a deep chest stretch.`,'Chest Fly':`Lie back with dumbbells (or cables) above your chest, slight elbow bend.|Open your arms wide in an arc until you feel a chest stretch.|Squeeze back together without changing the elbow angle.`,'Push-Up':`Hands just wider than shoulders, body in a straight line from head to heels.|Lower your chest to just above the floor, elbows about 45 degrees.|Push back up without sagging your hips.`,'Overhead Press':`Hold the bar at shoulder height, squeeze glutes and brace your core.|Press straight up, moving your head through once the bar passes your forehead.|Lock out overhead, then lower under control to your collarbone.`,'Lateral Raise':`Stand with light dumbbells at your sides, slight elbow bend.|Raise arms out to shoulder height, leading with the elbows.|Lower slowly; avoid swinging or shrugging.`,'Face Pull':`Set a rope at face height and pull it toward your forehead.|Flare elbows high and pull the ends apart beside your ears.|Squeeze shoulder blades together, then return slowly.`,'Rear Delt Fly':`Hinge forward with a flat back, light dumbbells hanging below you.|Raise arms out to the sides with a slight elbow bend.|Squeeze the rear shoulders at the top and lower slowly.`,'Barbell Row':`Hinge at the hips with a flat back, bar hanging at arm's length.|Pull the bar to your lower ribs, driving elbows back.|Pause, then lower under control without standing up.`,'Pull-Up':`Hang from the bar with an overhand grip slightly wider than shoulders.|Pull your chest toward the bar by driving elbows down.|Lower to a full hang each rep.`,'Lat Pulldown':`Sit with thighs under the pads, grip slightly wider than shoulders.|Lean back slightly and pull the bar to your upper chest.|Control the bar back up until arms are straight.`,'Seated Cable Row':`Sit tall with knees slightly bent and chest up.|Pull the handle to your stomach, squeezing shoulder blades together.|Return slowly without rounding your back.`,'Deadlift':`Stand with the bar over mid-foot, grip just outside your legs, chest up, back flat.|Push the floor away, keeping the bar close to your legs.|Lock hips and knees together at the top, then lower with control.`,'Squat':`Bar on upper back, feet shoulder-width, toes slightly out, brace your core.|Sit down and back, keeping knees tracking over toes.|Descend to at least parallel, then drive up through mid-foot.`,'Front Squat':`Rest the bar on your front shoulders with elbows high.|Squat down keeping your torso upright.|Drive up while keeping your elbows lifted.`,'Leg Press':`Sit with your back flat and feet shoulder-width on the platform.|Lower until knees reach about 90 degrees without your lower back lifting.|Press up without slamming your knees into lockout.`,'Romanian Deadlift':`Stand holding the bar with soft knees.|Push hips straight back, sliding the bar down your thighs.|Lower to a hamstring stretch, then drive hips forward to stand.`,'Lunge':`Step forward and lower until both knees are about 90 degrees.|Keep your torso upright and front knee over the foot.|Push through the front heel to return.`,'Leg Extension':`Adjust the pad to sit above your ankles and align knees with the pivot.|Extend your legs until straight, squeezing your quads.|Lower slowly.`,'Leg Curl':`Set the pad just above your heels.|Curl your heels toward your glutes.|Pause, then lower slowly.`,'Calf Raise':`Balls of feet on the platform, heels hanging off.|Rise as high as possible onto your toes.|Pause, then lower to a deep stretch.`,'Hip Thrust':`Upper back on a bench, bar over your hips, feet flat.|Drive through your heels until hips are fully extended.|Squeeze glutes at the top, then lower.`,'Bicep Curl':`Stand with dumbbells at your sides, palms forward.|Curl up keeping elbows pinned to your sides.|Lower slowly to full extension.`,'Hammer Curl':`Hold dumbbells with palms facing each other.|Curl up without rotating your wrists.|Lower under control.`,'Tricep Pushdown':`Stand at a cable with elbows tucked to your sides.|Press the handle down until arms are straight.|Return slowly without letting elbows drift forward.`,'Skull Crusher':`Lie back holding a bar or dumbbells over your chest, arms straight.|Bend only at the elbows to lower toward your forehead.|Extend back up, keeping upper arms still.`,'Dip':`Support yourself on parallel bars, arms straight.|Lower until upper arms are about parallel to the floor.|Press back up; lean forward for more chest, stay upright for triceps.`,'Plank':`Forearms on the floor, elbows under shoulders.|Keep a straight line from head to heels, squeezing abs and glutes.|Hold without letting your hips sag.`,'Cable Crunch':`Kneel at a cable with the rope by your head.|Curl your ribs toward your hips, rounding your spine.|Return slowly.`,'Hanging Leg Raise':`Hang from a bar with arms straight.|Raise your legs (knees bent or straight) by curling your pelvis up.|Lower slowly without swinging.`};

const EXT=[..._EX('HS Plate','Hammer Strength Plate-Loaded','Iso-Lateral Bench Press:cp,Iso-Lateral Horizontal Bench Press:cp,Iso-Lateral Incline Press:ip,Iso-Lateral Super Incline Press:sp,Iso-Lateral Decline Press:cp,Iso-Lateral Wide Chest:cp,Iso-Lateral Chest/Back:cb,Iso-Lateral Shoulder Press:sp,Super Fly:fl,Lateral Raise:lr,Pullover:pu,Seated Dip:dp,Seated Biceps:bc,Iso-Lateral D.Y. Row:rw,Iso-Lateral Row:rw,Iso-Lateral Low Row:rw,Iso-Lateral High Row:hr,Iso-Lateral Front Lat Pulldown:pd,Iso-Lateral Wide Pulldown:pd,T-Bar Row:rw,Seated/Standing Shrug:sh,Linear Leg Press:lp,Iso-Lateral Leg Press:lp,V-Squat:sq,Hack Squat:sq,Pendulum-X Squat:sq,Belt Squat:sq,Squat Lunge:sq,Vertical Smith Machine:sm,Iso-Lateral Leg Extension:le,Iso-Lateral Kneeling Leg Curl:lc,Iso-Lateral Leg Curl:lc,Seated Leg Curl:lc,Glute Drive:gl,Seated Calf Raise:cf,Super Horizontal Calf:cf,Tibia Dorsi Flexion:ti,Abdominal Oblique Crunch:ob,Assisted Nordic Ham:nh'),

  if(t.dataset.t){tab=t.dataset.t;ui={};render();return}
  ui.msg=null;
  const a=t.dataset.a,i=+t.dataset.i,j=+t.dataset.j,A=S.active;
  if(a==='import'){$('#imp').click();return}
  switch(a){
    case 'start':S.active={id:uid(),name:'Workout',start:null,ex:[],save:false};break;
    case 'rstart':{const r=S.routines[i];S.active={id:uid(),name:r.name,rid:r.id,upd:false,start:null,save:false,ex:rx(r).map(x=>({n:x.n,sets:blank(x.k||lastSets(x.n).length||3)}))};break}
    case 'rnew':ui.rb={name:'',ex:[]};break;
    case 'redit':{const r=S.routines[i];ui.rb={id:r.id,name:r.name,ex:rx(r).map(x=>({n:x.n,k:x.k||lastSets(x.n).length||3}))};break}
    case 'rcancel':ui.rb=null;break;
    case 'rrm':ui.rb.ex.splice(i,1);break;
    case 'rk':{const x=ui.rb.ex[i];x.k=Math.max(1,x.k+ +t.dataset.d);break}
    case 'rsave':{const b=ui.rb;if(!b.name.trim()||!b.ex.length){ui.msg='Name the routine and add an exercise';break}const r={id:b.id||uid(),name:b.name.trim(),ex:b.ex};const k=S.routines.findIndex(y=>y.id===b.id);if(k>=0)S.routines[k]=r;else S.routines.push(r);ui.rb=null;ui.msg='Routine saved';break}
    case 'rmenu':ui.rm=ui.rm===i?null:i;ui.rd=null;break;
    case 'rdel':if(ui.rd===i){S.routines.splice(i,1);ui.rd=null;ui.rm=null}else ui.rd=i;break;
    case 'cancel':if(ui.cc){S.active=null;ui.cc=false}else ui.cc=true;break;
    case 'pick':ui.pick=true;break;
    case 'closepick':ui.pick=false;ui.swap=null;break;
    case 'swap':ui.swap=i;ui.pick=true;break;
    case 'upd0':A.upd=false;break;
    case 'upd1':A.upd=true;break;
    case 'info':ui.info=t.dataset.n;break;
    case 'closeinfo':ui.info=null;break;
    case 'rg':ui.rg=t.dataset.v;break;
    case 'mt':ui.mt=t.dataset.v;break;
    case 'wu':{const s=A.ex[i].sets[j];s.t=s.t==='w'?'':'w';break}
    case 'add':if(ui.swap!=null){const e=A.ex[ui.swap];if(!e.o)e.o=e.n;e.n=t.dataset.n;e.sets=blank(e.sets.length);ui.swap=null}else if(ui.rb)ui.rb.ex.push({n:t.dataset.n,k:3});else A.ex.push({n:t.dataset.n,sets:freshSets(t.dataset.n)});ui.pick=false;break;
    case 'rmex':A.ex.splice(i,1);break;
    case 'addset':{const l=A.ex[i].sets.slice(-1)[0];A.ex[i].sets.push({w:l?l.w:'',r:l?l.r:'',d:false});break}
    case 'delset':A.ex[i].sets.pop();break;
    case 'chk':{const e=A.ex[i],s=e.sets[j],p=ph(e,j);if(!s.d&&p){if(s.w==='')s.w=p.w;if(s.r==='')s.r=p.r}s.d=!s.d;if(s.d&&!A.start)A.start=Date.now();S.rest=s.d?Date.now()+S.restSec*1000:0;break}
    case 'skip':S.rest=0;break;
    case 'finish':{
      const clean=A.ex.map(x=>({n:x.n,sets:x.sets.filter(s=>s.d||+s.r>0).map(s=>({w:+s.w||0,r:+s.r||0,t:s.t==='w'?'w':''}))})).filter(x=>x.sets.length);
      if(!clean.length){ui.msg='Log at least one set first';break}
      const prs=clean.filter(x=>{const a=rc(x.sets),b=recs(x.n);return a.w>b.w||a.e>b.e||a.v>b.v}).length;
      S.workouts.push({id:A.id,name:A.name||'Workout',date:Date.now(),dur:A.start?Date.now()-A.start:0,ex:clean});
      if(A.save)S.routines.push({id:uid(),name:A.name||'Routine',ex:clean.map(x=>({n:x.n,k:x.sets.length}))});
      if(A.upd&&A.rid){const r=S.routines.find(y=>y.id===A.rid);if(r)r.ex=A.ex.map(e=>({n:e.n,k:e.sets.length}))}
      S.active=null;S.rest=0;ui.msg='Workout saved'+(prs?` · ${prs} PR${prs>1?'s':''} 🏆`:'');break}
    case 'hdel':if(ui.hd===t.dataset.id){S.workouts=S.workouts.filter(w=>w.id!==t.dataset.id);ui.hd=null}else ui.hd=t.dataset.id;break;
    case 'cadd':{const n=$('#cn').value.trim(),m=$('#cm').value.trim()||'Other',sc=$('#cs').value.split(',').map(s=>s.trim()).filter(Boolean);if(n&&!all().some(x=>x.name.toLowerCase()===n.toLowerCase()))S.custom.push({name:n,muscle:m,sec:sc});break}
    case 'cdel':S.custom=S.custom.filter(x=>x.name!==t.dataset.n);break;
    case 'set':S[t.dataset.k]=isNaN(+t.dataset.v)?t.dataset.v:+t.dataset.v;break;
    case 'export':{
      const data=JSON.stringify(S,null,2),fn='liftlog-backup-'+new Date().toISOString().slice(0,10)+'.json';
      try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}catch(x){}
      const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));l.download=fn;l.click();return}
    case 'reset':if(ui.rs){S={unit:S.unit,restSec:90,custom:[],routines:[],workouts:[],active:null,rest:0};ui.rs=false}else ui.rs=true;break;
    default:return;
  }
  persist();render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.s){const[i,j,f]=t.dataset.s.split(',');S.active.ex[i].sets[j][f]=t.value;if(t.value&&!S.active.start)S.active.start=Date.now();persist()}
  else if('rn' in t.dataset)ui.rb.name=t.value
  else if('nm' in t.dataset){S.active.name=t.value;persist()}
  else if('q' in t.dataset){const q=t.value.toLowerCase();document.querySelectorAll('.item[data-k]').forEach(r=>r.style.display=r.dataset.k.includes(q)?'':'none')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if('sr' in t.dataset){S.active.save=t.checked;persist()}
  else if('sel' in t.dataset){ui.sx=t.value;render()}
  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.workouts))throw 0;S=Object.assign(S,d);persist();render()}catch(x){alert('That file is not a valid LiftLog backup.')}};r.readAsText(t.files[0])}
});
init();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>

<title>LiftLog</title>

<!-- LiftLog: a personal Hevy-style workout tracker. MIT License. Single file, no dependencies. Host anywhere. -->
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#17131f;--sub:#6c6678;--ac:#7048e8;--on-ac:#fff;--ln:#e6e2ef;--ok:#2f9e44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100e17;--card:#1b1826;--tx:#efecf6;--sub:#a09bb2;--ac:#b197fc;--on-ac:#150c2e;--ln:#2c2839;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#100e17;--card:#1b1826;--tx:#efecf6;--sub:#a09bb2;--ac:#b197fc;--on-ac:#150c2e;--ln:#2c2839;--ok:#51cf66}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h2{margin:6px 0 12px;font-size:24px}h3{margin:20px 0 8px;font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--on-ac);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--ln)}button.big{width:100%;padding:14px;font-size:17px}
button.red{background:#e03131}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:8px;width:100%}
input.title{font-size:22px;font-weight:700;border:0;background:transparent;padding:4px 0}
.set{display:grid;grid-template-columns:28px 1fr 80px 70px 40px;gap:6px;align-items:center;margin-top:6px}
.set input{text-align:center;padding:7px 4px}input::placeholder{color:var(--sub);opacity:.55}.set .sub{text-align:center}.set.done{background:rgba(47,158,68,.2);box-shadow:0 0 0 4px rgba(47,158,68,.2);border-radius:8px}.set.done input{background:transparent;border-color:transparent}
.chk{padding:8px 0;background:var(--ln);color:var(--sub)}.chk.on{background:var(--ok);color:#fff}
.hd{font-size:11px;color:var(--sub);text-transform:uppercase}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on-ac);border-radius:12px;padding:10px 14px;font-weight:700;display:none;z-index:6;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;max-width:560px;margin:0 auto}
.item{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.sw{position:relative;overflow:hidden;padding:0;cursor:default}.swin{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;background:var(--bg);position:relative;z-index:1;width:100%;transition:transform .2s;cursor:pointer}.sw.open .swin{transform:translateX(-150px)}.swact{position:absolute;right:0;top:0;bottom:0;width:150px;display:flex;z-index:0;pointer-events:none}.sw.open .swact{pointer-events:auto}.swact button{flex:1;border-radius:0}.rt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.rt.dragging{position:relative;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3)}.rt.over{outline:2px dashed var(--ac)}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(4,1fr);gap:8px}#kp button{background:var(--card);color:var(--tx);font-size:22px;font-weight:500;padding:14px 0;border:1px solid var(--ln);touch-action:manipulation}#kp .o{background:var(--ln)}#kp .nx{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}body.kp main{padding-bottom:340px}.set input:focus{border-color:var(--ac);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 10px;border-radius:16px;border:1px solid var(--ln);background:var(--bg);font-size:13px;cursor:pointer;color:var(--tx)}.chip.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}.chip.dis{opacity:.3;pointer-events:none}
.toast{background:var(--ok);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-weight:600}
.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--ln);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{text-align:center;margin:0}.stats b{font-size:22px;display:block}
</style>
</head>

  const sel=names.includes(ui.sx)?ui.sx:names[0];

  const pts=raw.map(a=>a.y);

let swt=0,tx=0,ty=0,tel=null;
document.addEventListener('touchstart',e=>{tel=e.target.closest('[data-sw]');if(tel){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!tel)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,el=tel;tel=null;if(Math.abs(dx)>40&&Math.abs(dy)<35){swt=Date.now();document.querySelectorAll('.sw.open').forEach(x=>{if(x!==el)x.classList.remove('open')});el.classList.toggle('open',dx<0);ui.sw=dx<0?el.dataset.sw:null}});
let cur=null,fresh=false;
function kpShow(el){if(cur!==el){cur=el;fresh=true}$('#kp').style.display='grid';document.body.classList.add('kp');setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},60)}
function kpHide(){cur=null;$('#kp').style.display='none';document.body.classList.remove('kp');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function keypress(k){if(!cur)return;const f=cur.dataset.s.split(',')[2];let v=String(cur.value);
  if(k==='hide')return kpHide();
  if(k==='next'){const a=[...document.querySelectorAll('input[data-s]')],n=a[a.indexOf(cur)+1];if(n)kpShow(n);else kpHide();return}
  if(k==='bk'){v=fresh?'':v.slice(0,-1);fresh=false}
  else if(k==='+'||k==='-'){const st=f==='w'?(S.step||1.25):1,b=parseFloat(v)||parseFloat(cur.placeholder)||0;v=String(Math.round(Math.max(0,b+(k==='+'?st:-st))*100)/100);fresh=true}
  else if(k==='.'){if(f==='r')return;if(fresh)v='0.';else if(v.includes('.'))return;else v=(v||'0')+'.';fresh=false}
  else{v=fresh?k:v+k;if(v.length>7)return;fresh=false}
  cur.value=v;cur.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){keypress(b.dataset.k);return}const inp=e.target.closest('input[data-s]');if(inp){kpShow(inp);return}if(cur&&!e.target.closest('#kp'))kpHide()});
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.matches&&t.matches('input[data-s]'))kpShow(t)});
let dr=null,dr0=null,lp=0;
document.addEventListener('touchstart',e=>{const rt=e.target.closest('.rt');if(!rt)return;dr0={el:rt,y:e.touches[0].clientY};clearTimeout(lp);lp=setTimeout(()=>{dr={el:rt,y0:dr0.y,over:null};rt.classList.add('dragging');swt=Date.now()},380)},{passive:true});
document.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;if(!dr){if(dr0&&Math.abs(y-dr0.y)>10)clearTimeout(lp);return}e.preventDefault();dr.el.style.transform='translateY('+(y-dr.y0)+'px)';dr.over=null;document.querySelectorAll('.rt').forEach(c=>{c.classList.remove('over');if(c!==dr.el){const r=c.getBoundingClientRect();if(y>=r.top&&y<=r.bottom){dr.over=c;c.classList.add('over')}}})},{passive:false});
const dfin=()=>{clearTimeout(lp);if(!dr)return;const d=dr;dr=null;swt=Date.now();d.el.style.transform='';d.el.classList.remove('dragging');document.querySelectorAll('.rt.over').forEach(c=>c.classList.remove('over'));if(d.over){const a=+d.el.dataset.ri,b=+d.over.dataset.ri,[x]=S.routines.splice(a,1);S.routines.splice(b,0,x);persist();render()}};
document.addEventListener('touchend',dfin);document.addEventListener('touchcancel',dfin);
init();
</script>
